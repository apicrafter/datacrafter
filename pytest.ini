[pytest]
addopts = 
    --verbose
    --strict-markers
    --tb=short
    -rfE
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: Integration tests
    backend(type): Backend specific test

# NOTE: Coverage configuration lives exclusively in .coveragerc (single source of
# truth). Coverage flags are passed by CI so ordinary local runs stay fast and
# artifact-free; run `pytest --cov=datacrafter --cov-report=term-missing`
# locally when you need coverage.
