[pytest]
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=datacrafter
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --doctest-modules
    -rfE
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    backend(type): Backend specific test
    meta: Meta test
    concurrent: Test requires true concurrency

# Setup logging
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s

log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = datacrafter
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */build/*
    */dist/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
